<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esengin</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      min-height: 100vh;
      background: #f7f5f0;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    .bg { position: fixed; inset: 0; z-index: 0; }
    .bg-grid { position: absolute; inset: 0; }

    .group {
      position: fixed;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 260px;
      cursor: pointer;
      z-index: 2;
      transition: top 0.7s cubic-bezier(0.4,0,0.2,1),
                  left 0.7s cubic-bezier(0.4,0,0.2,1),
                  right 0.7s cubic-bezier(0.4,0,0.2,1),
                  bottom 0.7s cubic-bezier(0.4,0,0.2,1),
                  transform 0.7s cubic-bezier(0.4,0,0.2,1);
    }

    .adults {
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }

    .children {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      width: 100%;
      margin-top: -10px;
    }

    .circle {
      border-radius: 50%;
      flex-shrink: 0;
      margin: 0 -10px;
      transition: background 0.5s ease, border-color 0.5s ease;
    }

    /* Default grey colors */
    .male   { background: #8a8a84; }
    .female { background: #d8d5d0; }
    .child-male   { background: #8a8a84; }
    .child-female { background: #d8d5d0; }

    .incoming {
      background: transparent !important;
      border: 3px dashed #b0ada8;
      animation: pulse-incoming 2s ease-in-out infinite;
    }

    @keyframes pulse-incoming {
      0%, 100% { opacity: 1; }
      50%       { opacity: 0.3; }
    }

    /* Expanded color overrides */
    .group.expanded .male         { background: #1e3a5f; }
    .group.expanded .female       { background: #d4938a; }
    .group.expanded .child-male   { background: #6b9fd4; }
    .group.expanded .child-female { background: #f0c4bc; }
    .group.expanded .incoming     { border-color: #6b9fd4; }

    /* Corner positions */
    .group1 { top: -80px;    left: -80px;   animation: fg1 16s ease-in-out infinite; }
    .group2 { top: -80px;    right: -80px;  animation: fg2 14s ease-in-out infinite; }
    .group3 { bottom: -80px; left: -80px;   animation: fg3 18s ease-in-out infinite; }
    .group4 { bottom: -80px; right: -80px;  animation: fg4 15s ease-in-out infinite; }

    @keyframes fg1 { 0%,100%{transform:translate(0,0)}   40%{transform:translate(15px,12px)}  70%{transform:translate(-5px,18px)} }
    @keyframes fg2 { 0%,100%{transform:translate(0,0)}   35%{transform:translate(-15px,12px)} 70%{transform:translate(10px,-8px)} }
    @keyframes fg3 { 0%,100%{transform:translate(0,0)}   50%{transform:translate(15px,-12px)} 80%{transform:translate(-10px,8px)} }
    @keyframes fg4 { 0%,100%{transform:translate(0,0)}   45%{transform:translate(-12px,-15px)} 75%{transform:translate(10px,10px)} }

    /* Expanded state */
    .group.expanded {
      top: 50% !important;
      left: 50% !important;
      right: auto !important;
      bottom: auto !important;
      transform: translate(-50%, -50%) !important;
      animation: none !important;
      width: 320px;
      z-index: 10;
    }

    .group.expanded .circle { margin: 0 -6px; }

    /* Overlay */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(247, 245, 240, 0.6);
      backdrop-filter: blur(4px);
      z-index: 9;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .overlay.active { opacity: 1; pointer-events: all; }

    /* Info */
    .group-info {
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease 0.4s;
      text-align: center;
      margin-top: 16px;
    }
    .group.expanded .group-info { opacity: 1; pointer-events: all; }

    .group-info h3 {
      font-family: 'Satisfy', cursive;
      font-size: 28px;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    .group-info p {
      font-family: 'Raleway', sans-serif;
      font-size: 11px;
      font-weight: 300;
      letter-spacing: 0.18em;
      color: #aaa;
      text-transform: uppercase;
    }

    /* Main content */
    .container {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
      padding: 60px 40px;
      text-align: center;
      pointer-events: none;
    }

    .logo {
      font-family: 'Satisfy', cursive;
      font-size: clamp(64px, 14vw, 88px);
      color: #1a1a1a;
      white-space: nowrap;
      opacity: 0;
      transform: translateY(20px);
      animation: fadeUp 1s ease forwards 0.3s;
      cursor: default;
      user-select: none;
      pointer-events: all;
    }

    .divider {
      width: 0; height: 1px;
      background: #c0bdb8;
      animation: expandLine 0.8s ease forwards 1s;
    }

    .datetime {
      font-family: 'Raleway', sans-serif;
      font-size: 11px; font-weight: 300;
      letter-spacing: 0.12em; color: #bbb;
      opacity: 0;
      animation: fadeIn 0.6s ease forwards 1.4s;
    }

    .confetti-piece {
      position: fixed; border-radius: 2px;
      pointer-events: none; z-index: 999;
      animation: confettiFall linear forwards;
    }
    @keyframes confettiFall {
      0%   { transform: translateY(0) rotate(0deg); opacity: 1; }
      100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
    }

    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
    @keyframes expandLine { to { width: 48px; } }
    @keyframes fadeIn { to { opacity: 1; } }

    /* Family Tree */
    .tree-overlay {
      position: fixed; inset: 0;
      background: rgba(247, 245, 240, 0.95);
      backdrop-filter: blur(10px);
      z-index: 50;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.4s ease;
    }
    .tree-overlay.open {
      opacity: 1;
      pointer-events: all;
    }
    .tree-title {
      font-family: 'Satisfy', cursive;
      font-size: 32px;
      color: #1a1a1a;
      margin-bottom: 48px;
      opacity: 0;
      transform: translateY(-10px);
      transition: opacity 0.4s ease 0.2s, transform 0.4s ease 0.2s;
    }
    .tree-overlay.open .tree-title {
      opacity: 1;
      transform: translateY(0);
    }
    .tree {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }
    .tree-row {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 60px;
    }
    .tree-node {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      opacity: 0;
      transform: translateY(10px);
      transition: opacity 0.4s ease, transform 0.4s ease;
    }
    .tree-overlay.open .tree-node { opacity: 1; transform: translateY(0); }
    .tree-overlay.open .tree-node:nth-child(1) { transition-delay: 0.3s; }
    .tree-overlay.open .tree-node:nth-child(2) { transition-delay: 0.4s; }
    .tree-overlay.open .tree-node:nth-child(3) { transition-delay: 0.5s; }
    .tree-overlay.open .tree-node:nth-child(4) { transition-delay: 0.6s; }

    .tree-couple {
      display: flex;
      align-items: flex-end;
      gap: -8px;
    }
    .tree-couple .tree-circle { margin: 0 -6px; }

    .tree-circle {
      border-radius: 50%;
      flex-shrink: 0;
    }
    .tree-label {
      font-family: 'Raleway', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.15em;
      color: #aaa;
      text-transform: uppercase;
      text-align: center;
    }

    /* Connector lines */
    .tree-connector {
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      margin: 0;
      opacity: 0;
      transition: opacity 0.4s ease 0.5s;
    }
    .tree-overlay.open .tree-connector { opacity: 1; }

    .tree-connector svg {
      overflow: visible;
    }

    .tree-hint {
      font-family: 'Raleway', sans-serif;
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.2em;
      color: #ccc;
      text-transform: uppercase;
      margin-top: 48px;
      opacity: 0;
      transition: opacity 0.4s ease 0.8s;
    }
    .tree-overlay.open .tree-hint { opacity: 1; }
  </style>
</head>
<body>

  <div class="bg">
    <svg class="bg-grid" xmlns="http://www.w3.org/2000/svg">
      <line x1="0" y1="25%" x2="100%" y2="25%" stroke="#2c2c2c" stroke-width="0.5" opacity="0.05"/>
      <line x1="0" y1="50%" x2="100%" y2="50%" stroke="#2c2c2c" stroke-width="0.5" opacity="0.05"/>
      <line x1="0" y1="75%" x2="100%" y2="75%" stroke="#2c2c2c" stroke-width="0.5" opacity="0.05"/>
      <line x1="25%" y1="0" x2="25%" y2="100%" stroke="#2c2c2c" stroke-width="0.5" opacity="0.05"/>
      <line x1="50%" y1="0" x2="50%" y2="100%" stroke="#2c2c2c" stroke-width="0.5" opacity="0.05"/>
      <line x1="75%" y1="0" x2="75%" y2="100%" stroke="#2c2c2c" stroke-width="0.5" opacity="0.05"/>
    </svg>
  </div>

  <div class="overlay" id="overlay" onclick="collapseAll()"></div>

  <!-- Family 1: female + male + incoming -->
  <div class="group group1" id="g1" onclick="toggleGroup(1)">
    <div class="adults">
      <div class="circle female" style="width:200px;height:200px;"></div>
      <div class="circle male"   style="width:220px;height:220px;"></div>
    </div>
    <div class="children">
      <div class="circle incoming" style="width:120px;height:120px;"></div>
    </div>
    <div class="group-info">
      <h3>Family One</h3>
      <p>Partner · Partner · incoming</p>
    </div>
  </div>

  <!-- Family 2: female + male -->
  <div class="group group2" id="g2" onclick="toggleGroup(2)">
    <div class="adults">
      <div class="circle female" style="width:200px;height:200px;"></div>
      <div class="circle male"   style="width:220px;height:220px;"></div>
    </div>
    <div class="group-info">
      <h3>Family Two</h3>
      <p>Partner · Partner</p>
    </div>
  </div>

  <!-- Family 3: female + male + boy + girl -->
  <div class="group group3" id="g3" onclick="toggleGroup(3)">
    <div class="adults">
      <div class="circle female" style="width:200px;height:200px;"></div>
      <div class="circle male"   style="width:220px;height:220px;"></div>
    </div>
    <div class="children">
      <div class="circle child-male"   style="width:120px;height:120px;"></div>
      <div class="circle child-female" style="width:110px;height:110px;"></div>
    </div>
    <div class="group-info">
      <h3>Family Three</h3>
      <p>Partner · Partner · Son · Daughter</p>
    </div>
  </div>

  <!-- Family 4: female + male + 2 boys + girl -->
  <div class="group group4" id="g4" onclick="toggleGroup(4)">
    <div class="adults">
      <div class="circle female" style="width:200px;height:200px;"></div>
      <div class="circle male"   style="width:220px;height:220px;"></div>
    </div>
    <div class="children">
      <div class="circle child-male"   style="width:120px;height:120px;"></div>
      <div class="circle child-male"   style="width:120px;height:120px;"></div>
      <div class="circle child-female" style="width:110px;height:110px;"></div>
    </div>
    <div class="group-info">
      <h3>Family Four</h3>
      <p>Partner · Partner · Son · Son · Daughter</p>
    </div>
  </div>

  <div class="container">
    <div class="logo" id="logo">Esengin</div>
    <div class="divider"></div>
    <div class="datetime" id="datetime"></div>
  </div>

  <script>
    let active = null;

    function toggleGroup(id) {
      const el = document.getElementById('g' + id);
      const overlay = document.getElementById('overlay');
      if (active === id) {
        el.classList.remove('expanded');
        overlay.classList.remove('active');
        active = null;
      } else {
        if (active) document.getElementById('g' + active).classList.remove('expanded');
        el.classList.add('expanded');
        overlay.classList.add('active');
        active = id;
      }
    }

    function collapseAll() {
      if (active) {
        document.getElementById('g' + active).classList.remove('expanded');
        document.getElementById('overlay').classList.remove('active');
        active = null;
      }
    }

    function updateTime() {
      const now = new Date();
      const date = now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
      const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
      document.getElementById('datetime').textContent = date + ' · ' + time;
    }
    updateTime();
    setInterval(updateTime, 1000);

    const logo = document.getElementById('logo');
    let taps = 0, tapTimer;
    logo.addEventListener('click', () => {
      taps++;
      clearTimeout(tapTimer);
      tapTimer = setTimeout(() => { taps = 0; }, 600);
      if (taps >= 3) { taps = 0; launchConfetti(); }
      else if (taps === 2) { openTree(); }
    });

    function openTree() {
      setTimeout(() => {
        const svg = document.getElementById('tree-svg');
        if (svg) svg.style.opacity = '1';
      }, 100);
      collapseAll();
      document.getElementById('tree-overlay').classList.add('open');
    }

    function closeTree() {
      document.getElementById('tree-overlay').classList.remove('open');
      const svg = document.getElementById('tree-svg');
      if (svg) svg.style.opacity = '0';
    }

    const colors = ['#f87171','#fb923c','#facc15','#4ade80','#60a5fa','#c084fc','#f472b6','#34d399'];
    function launchConfetti() {
      for (let i = 0; i < 80; i++) {
        setTimeout(() => {
          const p = document.createElement('div');
          p.classList.add('confetti-piece');
          p.style.left = Math.random() * 100 + 'vw';
          p.style.top = '-10px';
          p.style.background = colors[Math.floor(Math.random() * colors.length)];
          p.style.width = (6 + Math.random() * 6) + 'px';
          p.style.height = (6 + Math.random() * 6) + 'px';
          p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
          p.style.animationDelay = (Math.random() * 0.5) + 's';
          document.body.appendChild(p);
          setTimeout(() => p.remove(), 4000);
        }, i * 15);
      }
    }
  </script>


  <!-- Family Tree Overlay -->
  <div class="tree-overlay" id="tree-overlay" onclick="closeTree()">
    <div class="tree-title">The Esengin Family</div>

    <svg width="680" height="420" viewBox="0 0 680 420" style="overflow:visible; opacity:0; transition: opacity 0.4s ease 0.3s;" id="tree-svg">

      <!-- ── FAMILY TWO (parents) centered at x=340 ── -->
      <!-- Female circle -->
      <circle cx="316" cy="50" r="35" fill="#d4938a"/>
      <!-- Male circle -->
      <circle cx="352" cy="45" r="40" fill="#1e3a5f"/>
      <text x="334" y="105" text-anchor="middle" font-family="Raleway,sans-serif" font-size="10" letter-spacing="2" fill="#aaa" text-transform="uppercase">FAMILY TWO</text>

      <!-- Vertical down from F2 -->
      <line x1="334" y1="110" x2="334" y2="145" stroke="#ccc" stroke-width="1"/>
      <!-- Horizontal across to 3 children -->
      <line x1="120" y1="145" x2="550" y2="145" stroke="#ccc" stroke-width="1"/>
      <!-- Verticals down to each child family -->
      <line x1="120" y1="145" x2="120" y2="175" stroke="#ccc" stroke-width="1"/>
      <line x1="334" y1="145" x2="334" y2="175" stroke="#ccc" stroke-width="1"/>
      <line x1="550" y1="145" x2="550" y2="175" stroke="#ccc" stroke-width="1"/>

      <!-- ── FAMILY ONE (left, x=120) ── -->
      <circle cx="96"  cy="210" r="30" fill="#d4938a"/>
      <circle cx="128" cy="205" r="35" fill="#1e3a5f"/>
      <text x="112" y="258" text-anchor="middle" font-family="Raleway,sans-serif" font-size="10" letter-spacing="2" fill="#aaa">FAMILY ONE</text>
      <!-- Vertical to children -->
      <line x1="112" y1="263" x2="112" y2="285" stroke="#ccc" stroke-width="1"/>
      <!-- Incoming boy (dashed circle) -->
      <circle cx="112" cy="310" r="22" fill="none" stroke="#b0ada8" stroke-width="2" stroke-dasharray="5,3">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite"/>
      </circle>
      <text x="112" y="348" text-anchor="middle" font-family="Raleway,sans-serif" font-size="9" letter-spacing="1.5" fill="#ccc">incoming</text>

      <!-- ── FAMILY THREE (center, x=334) ── -->
      <circle cx="310" cy="210" r="30" fill="#d4938a"/>
      <circle cx="342" cy="205" r="35" fill="#1e3a5f"/>
      <text x="326" y="258" text-anchor="middle" font-family="Raleway,sans-serif" font-size="10" letter-spacing="2" fill="#aaa">FAMILY THREE</text>
      <!-- Vertical to children -->
      <line x1="326" y1="263" x2="326" y2="285" stroke="#ccc" stroke-width="1"/>
      <!-- Horizontal to 2 children -->
      <line x1="294" y1="285" x2="358" y2="285" stroke="#ccc" stroke-width="1"/>
      <line x1="294" y1="285" x2="294" y2="300" stroke="#ccc" stroke-width="1"/>
      <line x1="358" y1="285" x2="358" y2="300" stroke="#ccc" stroke-width="1"/>
      <!-- Boy -->
      <circle cx="294" cy="322" r="20" fill="#6b9fd4"/>
      <text x="294" y="356" text-anchor="middle" font-family="Raleway,sans-serif" font-size="9" letter-spacing="1.5" fill="#ccc">son</text>
      <!-- Girl -->
      <circle cx="358" cy="322" r="18" fill="#f0c4bc"/>
      <text x="358" y="356" text-anchor="middle" font-family="Raleway,sans-serif" font-size="9" letter-spacing="1.5" fill="#ccc">daughter</text>

      <!-- ── FAMILY FOUR (right, x=550) ── -->
      <circle cx="526" cy="210" r="30" fill="#d4938a"/>
      <circle cx="558" cy="205" r="35" fill="#1e3a5f"/>
      <text x="542" y="258" text-anchor="middle" font-family="Raleway,sans-serif" font-size="10" letter-spacing="2" fill="#aaa">FAMILY FOUR</text>
      <!-- Vertical to children -->
      <line x1="542" y1="263" x2="542" y2="285" stroke="#ccc" stroke-width="1"/>
      <!-- Horizontal to 3 children -->
      <line x1="490" y1="285" x2="594" y2="285" stroke="#ccc" stroke-width="1"/>
      <line x1="490" y1="285" x2="490" y2="300" stroke="#ccc" stroke-width="1"/>
      <line x1="542" y1="285" x2="542" y2="300" stroke="#ccc" stroke-width="1"/>
      <line x1="594" y1="285" x2="594" y2="300" stroke="#ccc" stroke-width="1"/>
      <!-- Boy 1 -->
      <circle cx="490" cy="322" r="20" fill="#6b9fd4"/>
      <text x="490" y="356" text-anchor="middle" font-family="Raleway,sans-serif" font-size="9" letter-spacing="1.5" fill="#ccc">son</text>
      <!-- Boy 2 -->
      <circle cx="542" cy="322" r="20" fill="#6b9fd4"/>
      <text x="542" y="356" text-anchor="middle" font-family="Raleway,sans-serif" font-size="9" letter-spacing="1.5" fill="#ccc">son</text>
      <!-- Girl -->
      <circle cx="594" cy="322" r="18" fill="#f0c4bc"/>
      <text x="594" y="356" text-anchor="middle" font-family="Raleway,sans-serif" font-size="9" letter-spacing="1.5" fill="#ccc">daughter</text>

    </svg>

    <div class="tree-hint" style="margin-top:24px;">tap to close</div>
  </div>
</body>
</html>
