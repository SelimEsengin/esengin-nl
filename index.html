<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Esengin</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Satisfy&family=Raleway:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body {
  min-height: 100vh;
  background: #f7f5f0;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
}
.bg { position: fixed; inset: 0; z-index: 0; }
.bg-grid { position: absolute; inset: 0; }
.group {
  position: fixed;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  width: 260px;
  cursor: pointer;
  z-index: 2;
  transition: top 0.7s cubic-bezier(0.4,0,0.2,1),
              left 0.7s cubic-bezier(0.4,0,0.2,1),
              right 0.7s cubic-bezier(0.4,0,0.2,1),
              bottom 0.7s cubic-bezier(0.4,0,0.2,1),
              transform 0.7s cubic-bezier(0.4,0,0.2,1);
}
.adults {
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.children {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  width: 100%;
  margin-top: -10px;
}
.circle {
  border-radius: 50%;
  flex-shrink: 0;
  margin: 0 -10px;
  transition: background 0.5s ease, border-color 0.5s ease;
}
/* Default grey colors */
.male { background: #8a8a84; }
.female { background: #d8d5d0; }
.child-male { background: #8a8a84; }
.child-female { background: #d8d5d0; }
.incoming {
  background: transparent !important;
  border: 3px dashed #b0ada8;
  animation: pulse-incoming 2s ease-in-out infinite;
}
@keyframes pulse-incoming {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.3; }
}
/* Expanded color overrides */
.group.expanded .male { background: #1e3a5f; }
.group.expanded .female { background: #d4938a; }
.group.expanded .child-male { background: #6b9fd4; }
.group.expanded .child-female { background: #f0c4bc; }
.group.expanded .incoming { border-color: #6b9fd4; }

/* Photo circles — override color with photo */
.photo-circle {
  border-radius: 50%;
  flex-shrink: 0;
  margin: 0 -10px;
  overflow: hidden;
  background: #d8d5d0;
  transition: border-color 0.5s ease;
}
.photo-circle img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  object-position: top center;
  display: block;
}

/* Corner positions */
.group1 { top: -80px; left: -80px; animation: fg1 16s ease-in-out infinite; }
.group2 { top: -80px; right: -80px; animation: fg2 14s ease-in-out infinite; }
.group3 { bottom: -80px; left: -80px; animation: fg3 18s ease-in-out infinite; }
.group4 { bottom: -80px; right: -80px; animation: fg4 15s ease-in-out infinite; }
@keyframes fg1 { 0%,100%{transform:translate(0,0)} 40%{transform:translate(15px,12px)} 70%{transform:translate(-5px,18px)} }
@keyframes fg2 { 0%,100%{transform:translate(0,0)} 35%{transform:translate(-15px,12px)} 70%{transform:translate(10px,-8px)} }
@keyframes fg3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(15px,-12px)} 80%{transform:translate(-10px,8px)} }
@keyframes fg4 { 0%,100%{transform:translate(0,0)} 45%{transform:translate(-12px,-15px)} 75%{transform:translate(10px,10px)} }
/* Expanded state */
.group.expanded {
  top: 50% !important;
  left: 50% !important;
  right: auto !important;
  bottom: auto !important;
  transform: translate(-50%, -50%) !important;
  animation: none !important;
  width: 320px;
  z-index: 10;
}
.group.expanded .circle { margin: 0 -6px; }
.group.expanded .photo-circle { margin: 0 -6px; }
/* Overlay */
.overlay {
  position: fixed; inset: 0;
  background: rgba(247, 245, 240, 0.6);
  backdrop-filter: blur(4px);
  z-index: 9;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.overlay.active { opacity: 1; pointer-events: all; }
/* Info */
.group-info {
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease 0.4s;
  text-align: center;
  margin-top: 16px;
}
.group.expanded .group-info { opacity: 1; pointer-events: all; }
.group-info h3 {
  font-family: 'Satisfy', cursive;
  font-size: 28px;
  color: #1a1a1a;
  margin-bottom: 6px;
}
.group-info p {
  font-family: 'Raleway', sans-serif;
  font-size: 11px;
  font-weight: 300;
  letter-spacing: 0.18em;
  color: #aaa;
  text-transform: uppercase;
}
/* Main content */
.container {
  position: relative;
  z-index: 3;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 24px;
  padding: 60px 40px;
  text-align: center;
  pointer-events: none;
}
.logo {
  font-family: 'Satisfy', cursive;
  font-size: clamp(64px, 14vw, 88px);
  color: #1a1a1a;
  white-space: nowrap;
  opacity: 0;
  transform: translateY(20px);
  animation: fadeUp 1s ease forwards 0.3s;
  cursor: default;
  user-select: none;
  pointer-events: all;
}
.divider {
  width: 0; height: 1px;
  background: #c0bdb8;
  animation: expandLine 0.8s ease forwards 1s;
}
.datetime {
  font-family: 'Raleway', sans-serif;
  font-size: 11px; font-weight: 300;
  letter-spacing: 0.12em; color: #bbb;
  opacity: 0;
  animation: fadeIn 0.6s ease forwards 1.4s;
  transition: color 0.3s ease, text-shadow 0.3s ease;
}
.datetime.on-circle {
  color: #fff;
  text-shadow: 0 1px 8px rgba(0, 0, 0, 0.35);
}
.confetti-piece {
  position: fixed; border-radius: 2px;
  pointer-events: none; z-index: 999;
  animation: confettiFall linear forwards;
}
@keyframes confettiFall {
  0% { transform: translateY(0) rotate(0deg); opacity: 1; }
  100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
}
@keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }
@keyframes expandLine { to { width: 48px; } }
@keyframes fadeIn { to { opacity: 1; } }
/* Family Tree */
.tree-overlay {
  position: fixed; inset: 0;
  background: rgba(247, 245, 240, 0.95);
  backdrop-filter: blur(10px);
  z-index: 50;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
}
.tree-overlay.open {
  opacity: 1;
  pointer-events: all;
}
.tree-title {
  font-family: 'Satisfy', cursive;
  font-size: 32px;
  color: #1a1a1a;
  margin-bottom: 48px;
  opacity: 0;
  transform: translateY(-10px);
  transition: opacity 0.4s ease 0.2s, transform 0.4s ease 0.2s;
}
.tree-overlay.open .tree-title {
  opacity: 1;
  transform: translateY(0);
}
.tree {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0;
}
.tree-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 60px;
}
.tree-node {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 8px;
  opacity: 0;
  transform: translateY(10px);
  transition: opacity 0.4s ease, transform 0.4s ease;
}
.tree-overlay.open .tree-node { opacity: 1; transform: translateY(0); }
.tree-overlay.open .tree-node:nth-child(1) { transition-delay: 0.3s; }
.tree-overlay.open .tree-node:nth-child(2) { transition-delay: 0.4s; }
.tree-overlay.open .tree-node:nth-child(3) { transition-delay: 0.5s; }
.tree-overlay.open .tree-node:nth-child(4) { transition-delay: 0.6s; }
.tree-couple {
  display: flex;
  align-items: flex-end;
  gap: -8px;
}
.tree-couple .tree-circle { margin: 0 -6px; }
.tree-circle {
  border-radius: 50%;
  flex-shrink: 0;
}
.tree-label {
  font-family: 'Raleway', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.15em;
  color: #aaa;
  text-transform: uppercase;
  text-align: center;
}
/* Connector lines */
.tree-connector {
  width: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 0;
  opacity: 0;
  transition: opacity 0.4s ease 0.5s;
}
.tree-overlay.open .tree-connector { opacity: 1; }
.tree-connector svg {
  overflow: visible;
}
.tree-hint {
  font-family: 'Raleway', sans-serif;
  font-size: 10px;
  font-weight: 300;
  letter-spacing: 0.2em;
  color: #ccc;
  text-transform: uppercase;
  margin-top: 48px;
  opacity: 0;
  transition: opacity 0.4s ease 0.8s;
}
.tree-overlay.open .tree-hint { opacity: 1; }
</style>
</head>

<script>
let active = null;
function toggleGroup(id) {
  const el = document.getElementById('g' + id);
  const overlay = document.getElementById('overlay');
  if (active === id) {
    el.classList.remove('expanded');
    overlay.classList.remove('active');
    active = null;
  } else {
    if (active) document.getElementById('g' + active).classList.remove('expanded');
    el.classList.add('expanded');
    overlay.classList.add('active');
    active = id;
  }
}
function collapseAll() {
  if (active) {
    document.getElementById('g' + active).classList.remove('expanded');
    document.getElementById('overlay').classList.remove('active');
    active = null;
  }
}
function updateTime() {
  const now = new Date();
  const date = now.toLocaleDateString('en-GB', { weekday: 'short', day: 'numeric', month: 'short' });
  const time = now.toLocaleTimeString('en-GB', { hour: '2-digit', minute: '2-digit' });
  document.getElementById('datetime').textContent = date + ' · ' + time;
}
updateTime();
setInterval(updateTime, 1000);
const datetimeEl = document.getElementById('datetime');
const bgCircles = document.querySelectorAll('.group .circle:not(.incoming), .group .photo-circle');
function updateSubtitleContrast() {
  const r = datetimeEl.getBoundingClientRect();
  let onCircle = false;
  for (const c of bgCircles) {
    const cr = c.getBoundingClientRect();
    const cx = cr.left + cr.width / 2;
    const cy = cr.top + cr.height / 2;
    const nearestX = Math.max(r.left, Math.min(cx, r.right));
    const nearestY = Math.max(r.top, Math.min(cy, r.bottom));
    const dx = cx - nearestX, dy = cy - nearestY;
    if (dx * dx + dy * dy < (cr.width / 2) * (cr.width / 2)) { onCircle = true; break; }
  }
  datetimeEl.classList.toggle('on-circle', onCircle);
}
updateSubtitleContrast();
setInterval(updateSubtitleContrast, 250);
const logo = document.getElementById('logo');
let taps = 0, tapTimer;
logo.addEventListener('click', () => {
  taps++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { taps = 0; }, 600);
  if (taps >= 3) { taps = 0; launchConfetti(); }
  else if (taps === 2) { openTree(); }
});
function openTree() {
  setTimeout(() => {
    const svg = document.getElementById('tree-svg');
    if (svg) svg.style.opacity = '1';
  }, 100);
  collapseAll();
  document.getElementById('tree-overlay').classList.add('open');
}
function closeTree() {
  document.getElementById('tree-overlay').classList.remove('open');
  const svg = document.getElementById('tree-svg');
  if (svg) svg.style.opacity = '0';
}
const colors = ['#f87171','#fb923c','#facc15','#4ade80','#60a5fa','#c084fc','#f472b6','#34d399'];
function launchConfetti() {
  for (let i = 0; i < 80; i++) {
    setTimeout(() => {
      const p = document.createElement('div');
      p.classList.add('confetti-piece');
      p.style.left = Math.random() * 100 + 'vw';
      p.style.top = '-10px';
      p.style.background = colors[Math.floor(Math.random() * colors.length)];
      p.style.width = (6 + Math.random() * 6) + 'px';
      p.style.height = (6 + Math.random() * 6) + 'px';
      p.style.animationDuration = (1.5 + Math.random() * 2) + 's';
      p.style.animationDelay = (Math.random() * 0.5) + 's';
      document.body.appendChild(p);
      setTimeout(() => p.remove(), 4000);
    }, i * 15);
  }
}
</script>
